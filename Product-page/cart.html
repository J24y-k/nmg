<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - NMG Zembeta</title>
  <link rel="stylesheet" href="checkout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Temp loading style to hide content until auth check */
    body.loading main { display: none; }
  </style>
</head>
<body class="loading"> <!-- Add 'loading' class initially -->
  <div id="custom-cursor"></div>

  <nav class="nav">
    <div class="logo"><img src="../LOGO NMG.png" alt="Logo"></div>
    <div class="nav-links" id="nav-links">
      <a href="/Homepage/index.html">Home</a>
      <a href="/About page/about.html">About</a>
      <a href="/SERVICE PAGE/service.html">Services</a>
      <a href="/Contact-page/contact.html">Contact</a>

      <!-- Sign In link (only visible when logged out) -->
      <a href="../Homepage/signin.html" id="nav-signin">Sign In</a>

      <!-- Profile dropdown (only visible when logged in) -->
      <div class="profile-dropdown" id="profile-dropdown" style="display:none;">
        <img id="profile-icon" class="profile-icon" src="https://via.placeholder.com/40" alt="Profile" />
        <div class="dropdown-menu" id="dropdown-menu">
          <a href="/Homepage/profile.html">Profile</a>
          <a href="cart.html">Cart</a>
          <a href="#" id="logout">Logout</a>
        </div>
      </div>
    </div>
    <div class="hamburger-menu" id="hamburger-menu">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="search">🔍</div>
    <a href="cart.html" class="cart-icon" id="cart-icon">🛒 <span id="cart-count">0</span></a>
  </nav>

  <main>
    <section class="cart section">
      <div class="container">
        <h2 class="section-title">Your Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-total">
          <h3>Total: R<span id="total-price">0</span></h3>
        </div>
        <button id="proceed-to-checkout" class="submit-button">Proceed to Checkout</button>
        <a href="products.html" class="continue-shopping">Continue Shopping</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>Copyright © 2025 NMG Zembeta. All rights reserved. Website made by Jay_k & Kuti.</p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="data.js"></script>
  <script src="cart.js"></script>

  <!-- Adjust path if firebase-auth.js is in a different folder (e.g., ../firebase-auth.js) -->
  <script type="module" src="/Homepage/firebase-auth.js"></script> <!-- For page guard -->
  <script type="module" src="/Homepage/auth-ui.js"></script> <!-- For nav dropdown -->

  <!-- Page guard + button guard -->
  <script type="module">
    import { auth, onAuthStateChanged } from "/Homepage/firebase-auth.js"; // Adjust path if needed (e.g., ../)

    // Page-level guard: Redirect if not logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Logged in: Show content
        document.body.classList.remove('loading');
      } else {
        // Not logged in: Redirect
        window.location.href = "/Homepage/signin.html?return=/Product-page/checkout.html";
      }
    });

    // Guard checkout button (existing, but keep for completeness)
    const btn = document.getElementById('proceed-to-checkout');
    if (btn) {
      btn.addEventListener('click', (e) => {
        const user = auth.currentUser;
        if (!user) {
          e.preventDefault();
          window.location.href = "signin.html?return=checkout.html";
        }
      });
    }
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.body.classList.add("loaded");
    });
  </script>
</body>
</html>
