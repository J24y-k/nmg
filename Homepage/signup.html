<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up • NMG Zembeta</title>
  <!-- Base styles -->
  <link rel="stylesheet" href="index-style.css" />
  <!-- Auth-specific styles -->
  <link rel="stylesheet" href="auth-style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div id="custom-cursor"></div>

  <nav class="nav">
    <div class="logo">
      <a href="index.html" aria-label="Back to home"><img src="../LOGO NMG.png" alt="Logo" /></a>
    </div>
    <div class="nav-links" id="nav-links">
      <a href="../About page/about.html">About</a>
      <a href="index.html#services">Services</a>
      <a href="../Contact-page/contact.html">Contact</a>
      <a href="signin.html" style=" left: 550px; position: relative;">Sign In</a>
      <a class="button" href="signup.html" style="padding:8px 16px; font-size:.9rem; left: 550px; position: relative;">Create Account</a>
    </div>
    <div class="hamburger-menu" id="hamburger-menu">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="search">🔍</div>
  </nav>

  <main class="auth-section">
    <div class="auth-bg"></div>
    <div class="auth-overlay"></div>

    <section class="auth-card card">
      <h1 class="auth-title gradient-text">Create your account</h1>
      <p class="auth-subtitle">Join NMG Zembeta</p>

      <form id="signup-form" class="auth-form" autocomplete="on">
        <div class="input-row">
          <div class="input-group">
            <label for="signup-name">Full name</label>
            <input id="signup-name" name="name" type="text" placeholder="Jane Doe" required />
          </div>
        </div>

        <div class="input-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="input-row">
          <div class="input-group has-toggle">
            <label for="signup-password">Password</label>
            <input id="signup-password" name="password" type="password" placeholder="Min. 6 characters" minlength="6" required />
            <button class="toggle-visibility" type="button" data-toggle="signup-password" aria-label="Show or hide password">👁️</button>
          </div>
          <div class="input-group has-toggle">
            <label for="signup-confirm">Confirm password</label>
            <input id="signup-confirm" name="confirm" type="password" placeholder="Retype password" minlength="6" required />
            <button class="toggle-visibility" type="button" data-toggle="signup-confirm" aria-label="Show or hide password">👁️</button>
          </div>
        </div>

        <label class="checkbox">
          <input id="signup-agree" name="agree" type="checkbox" required />
          <span>I agree to the Terms & Privacy Policy</span>
        </label>

        <div id="signup-error" class="auth-error" role="alert" aria-live="polite" style="display:none;"></div>

        <button class="button button--full" type="submit">Create account</button>

        <div class="divider"><span>or</span></div>

        <button id="google-signup" class="oauth-button" type="button">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" aria-hidden="true"/>
          Continue with Google
        </button>

        <p class="form-hint">Already have an account? <a class="link" href="signin.html">Sign in</a></p>
      </form>
    </section>
  </main>

  <script>
document.addEventListener("DOMContentLoaded", function() {
    document.body.classList.add("loaded");
});
  </script>
  <script src="auth-script.js"></script>
  <!-- Firebase (we'll wire this in step 2) -->
  <script type="module" src="firebase-auth.js"></script>
</body>
</html>
